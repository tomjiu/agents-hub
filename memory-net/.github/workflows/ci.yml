name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite 默认启用始于 23.4（22.x 需 --experimental-sqlite，故 22 不入矩阵）
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --test dist/tests/*.test.js
      - name: dsh 适配包契约测试（mock ctx，零依赖真实 dsh）
        run: npm --prefix adapters/dsh test
      - name: 三条演示命令端到端
        run: bash scripts/demo.sh

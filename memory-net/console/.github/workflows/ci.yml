name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build (server + console)
        run: npm run build

      - name: Test (server contract)
        run: npm test

      - name: Vendor integrity (re-fetch pinned sha, rebuild, diff)
        run: bash scripts/verify-vendor.sh
